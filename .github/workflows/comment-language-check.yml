name: Comment Language File Check

on:
  workflow_run:
    workflows:
      - Check Language Files
    types:
      - completed

permissions:
  actions: read
  contents: read
  issues: write
  pull-requests: write

jobs:
  comment:
    name: Comment on PR
    if: github.event.workflow_run.conclusion != 'cancelled'
    runs-on: ubuntu-latest

    steps:
      - name: Download report
        uses: actions/download-artifact@v8
        with:
          name: language-check-report
          path: report
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ github.event.workflow_run.id }}

      - name: Comment on PR
        uses: actions/github-script@v9
        with:
          script: |
            const fs = require("fs");

            const marker = "<!-- language-file-check -->";
            const report = fs.readFileSync("report/lang-check-report.md", "utf8");
            const body = `${marker}\n${report}`;
            const { owner, repo } = context.repo;
            const pullRequests = context.payload.workflow_run.pull_requests || [];

            if (pullRequests.length === 0) {
              core.setFailed("The completed workflow run is not associated with a pull request.");
              return;
            }

            const issue_number = pullRequests[0].number;
            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100
              }
            );

            const existing = comments.find(comment =>
              comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
