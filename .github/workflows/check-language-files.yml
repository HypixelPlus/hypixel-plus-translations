name: Check Language Files

on:
  pull_request:
    paths:
      - "assets/minecraft/lang/*.json"
      - "!assets/minecraft/lang/en_us.json"

permissions:
  contents: read
  pull-requests: write

jobs:
  check:
    name: Check language files
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine languages
        id: languages
        shell: bash
        env:
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail

          echo "base=en_us" >> "$GITHUB_OUTPUT"

          changed_files=$(git diff --name-only "$PR_BASE_SHA" "$PR_HEAD_SHA" -- \
            'assets/minecraft/lang/*.json')

          languages=""

          while IFS= read -r file; do
            [[ -z "$file" ]] && continue

            filename=$(basename "$file")

            # Skip the base language
            if [[ "$filename" == "en_us.json" ]]; then
              continue
            fi

            language="${filename%.json}"

            if [[ -z "$languages" ]]; then
              languages="$language"
            else
              languages="$languages,$language"
            fi
          done <<< "$changed_files"

          echo "languages=$languages" >> "$GITHUB_OUTPUT"

          echo "Changed translation files:"
          echo "$languages"

      - name: Check language files
        id: check
        if: steps.languages.outputs.languages != ''
        continue-on-error: true
        run: |
          python3 .github/scripts/check_lang.py \
            --base "${{ steps.languages.outputs.base }}" \
            --languages "${{ steps.languages.outputs.languages }}" \
            --output lang-check-report.md

      - name: Upload report
        if: always() && steps.languages.outputs.languages != ''
        uses: actions/upload-artifact@v4
        with:
          name: language-check-report
          path: lang-check-report.md

      - name: Comment on PR
        if: github.event_name == 'pull_request' && steps.languages.outputs.languages != ''
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");

            const marker = "<!-- language-file-check -->";
            const report = fs.readFileSync("lang-check-report.md", "utf8");

            const body = `${marker}\n${report}`;

            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;

            const comments = await github.paginate(
              github.rest.issues.listComments,
              {
                owner,
                repo,
                issue_number,
                per_page: 100
              }
            );

            const existing = comments.find(comment =>
              comment.body && comment.body.includes(marker)
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
